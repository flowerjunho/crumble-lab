# main 브랜치에 push하면 테스트 → 빌드 → GitHub Pages 배포까지 자동으로 진행한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 연달아 push해도 배포가 겹치지 않게 하고, 진행 중인 배포는 끝까지 마친다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build
        run: npm run build
        env:
          # 프로젝트 페이지 주소가 https://<계정>.github.io/<저장소>/ 이므로 저장소 이름을 base로 쓴다.
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages는 SPA 경로(/stage 등)를 모른다. 없는 경로는 404.html을 보여 주므로
      # index.html을 그대로 복사해 두면 새로고침이나 직접 접속에서도 앱이 뜬다.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
